controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /roombabot_controller/odom
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker_plugin: "progress_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.18
      resolution: 0.05
      # Without a rolling window the costmap is a fixed 5x5 m box at the map origin
      # (0,0)-(4.98,4.98); the robot driving outside it makes the obstacle layer warn
      # "Sensor origin ... out of map bounds". Rolling window keeps it centered on the robot.
      rolling_window: true
      width: 3
      height: 3
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          combination_method: 1
          raytrace_max_range: 3.0
          raytrace_min_range: 0.16
          obstacle_max_range: 2.5
          obstacle_min_range: 0.16 # inside this is the robot's own shell

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Same reasoning as the local costmap (costmap.yaml) -- 1.5ft caution runway for
        # cost_penalty_weight to bias routes away from edges over, without moving the
        # decay-rate-controlled hard passable/impassable line itself.
        inflation_radius: 0.4572
        # With cost_scaling_factor 3.0, cost at the edge of the (then) 0.2m inflation_radius
        # was still ~186 -- above DijkstraPlanner's cost<99 traversability threshold the whole
        # way out, so nearly anything within 0.2m of a wall was a hard wall to it, not just
        # costly. A steeper falloff gets cost below 99 well inside the radius instead.
        cost_scaling_factor: 10.0